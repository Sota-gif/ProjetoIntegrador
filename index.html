<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar - MCMSA</title>
    <link rel="stylesheet" href="Css/indexStyle.css">
</head>
<body>

    <div class="container">
        <!-- Tela de Login -->
        <div id="tela-login" class="card-auth">
            <div class="logo-badge">MCMSA</div>
            <h2>Bem-vindo de volta</h2>
            <p class="subtitulo">Acesse sua conta para acompanhar sua saúde</p>

            <input class="campo" type="text" id="loginNome" placeholder="Nome de Usuário">
            <input class="campo" type="password" id="loginSenha" placeholder="Sua Senha">
            
            <button onclick="logar()" class="btn-primario">Entrar</button>
            <button onclick="entrarSemLogin()" class="btn-secundario">Entrar sem login (Visitante)</button>

            <p class="texto-alternar">
                Não tem conta? <a href="#" onclick="alternarAbas('cadastro')">Cadastre-se aqui</a>
            </p>
        </div>

        <!-- Tela de Cadastro -->
        <div id="cadastro" class="card-auth oculto">
            <div class="logo-badge">MCMSA</div>
            <h2>Criar Conta</h2>
            <p class="subtitulo">Preencha seus dados básicos</p>

            <input class="campo" type="text" id="nome" placeholder="Nome completo">
            <div class="linha-dupla">
                <input class="campo" type="number" id="idade" placeholder="Idade">
                <input class="campo" type="number" id="altura" placeholder="Altura (cm)">
            </div>
            <input class="campo" type="number" id="peso" placeholder="Peso (kg)">
            <input class="campo" type="password" id="senha" placeholder="Crie uma senha">
            
            <button class="btn-primario" onclick="cadastrar()">Finalizar Cadastro</button>

            <p class="texto-alternar">
                Já tem conta? <a href="#" onclick="alternarAbas('login')">Faça login</a>
            </p>
        </div>
    </div>

    <script>
        function alternarAbas(aba) {
            const loginBox = document.getElementById('tela-login');
            const cadastroBox = document.getElementById('cadastro');

            if (aba === 'cadastro') {
                loginBox.classList.add('oculto');
                cadastroBox.classList.remove('oculto');
            } else {
                cadastroBox.classList.add('oculto');
                loginBox.classList.remove('oculto');
            }
        }

        function cadastrar() {
            const nome = document.getElementById('nome').value.trim();
            const idade = document.getElementById('idade').value;
            const altura = document.getElementById('altura').value;
            const peso = document.getElementById('peso').value;
            const senha = document.getElementById('senha').value;

            if (nome && idade && altura && peso && senha) {
                const contaUsuario = { nome, idade, altura, peso, senha };
                localStorage.setItem('contaUsuario', JSON.stringify(contaUsuario));
                alert('Cadastro efetuado com sucesso! Faça login agora.');
                alternarAbas('login');
            } else {
                alert('Por favor, preencha todos os campos do cadastro!');
            }
        }

        function logar() {
            const usuarioDigitado = document.getElementById('loginNome').value.trim();
            const senhaDigitada = document.getElementById('loginSenha').value;
            const dadosSalvos = localStorage.getItem('contaUsuario');

            if (!dadosSalvos) {
                alert('Nenhum usuário registrado ainda! Clique em Cadastre-se ou entre como visitante.');
                return;
            }

            const contaUsuario = JSON.parse(dadosSalvos);

            if (usuarioDigitado === contaUsuario.nome && senhaDigitada === contaUsuario.senha) {
                localStorage.setItem('usuarioLogado', contaUsuario.nome);
                window.location.href = "Html/PaginaPrincipal.html";
            } else {
                alert('Nome de usuário ou senha incorretos!');
            }
        }

        function entrarSemLogin() {
            localStorage.setItem('usuarioLogado', 'Visitante');
            window.location.href = "Html/PaginaPrincipal.html";
        }
    </script>
</body>
</html>
